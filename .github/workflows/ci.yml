name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Validate updater configuration
        shell: bash
        run: |
          if grep -q "PLACEHOLDER" src-tauri/tauri.conf.json; then
            echo "  Updater pubkey is still a PLACEHOLDER"
            echo ""
            echo "To generate a real updater key for releases:"
            echo "  1. Run locally:  npx tauri signer generate -w <password>"
            echo "  2. Copy the public key into src-tauri/tauri.conf.json pubkey field"
            echo "  3. Store the private key securely (used by CI for signing updates)"
            echo ""
            if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo " Cannot push to main branch with PLACEHOLDER pubkey"
              exit 1
            elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
              echo " Cannot create release tags with PLACEHOLDER pubkey"
              exit 1
            else
              echo " Development/PR builds allowed with placeholder (fix before release)"
            fi
          else
            echo " Updater pubkey is configured"
          fi

      - name: Enforce changeset for versioned PRs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          echo "Checking for changesets since origin/$BASE ..."
          if npx changeset status --since="origin/$BASE"; then
            echo "✅ Changeset present (or no user-facing changes detected)."
          else
            echo ""
            echo "❌ This PR changes code but does not include a changeset."
            echo "   Run locally:  npm run changeset"
            echo "   Commit the generated .changeset/ file to 'set' the next app version."
            echo "   Use 'patch' for bugfixes, 'minor' for features, 'major' for breaking changes."
            exit 1
          fi

      - name: Frontend check
        run: npm run check

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  build:
    needs: [check, test]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust (Windows)
        if: matrix.os == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust (macOS)
        if: matrix.os == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri (debug for CI speed)
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Build debug to keep CI fast; release on tags
          args: --debug --no-sign

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-debug
          path: |
            src-tauri/target/debug/bundle/**
            src-tauri/target/debug/*.exe
          retention-days: 7