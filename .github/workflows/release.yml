name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.3.0) - for testing without a tag"
        required: false
        default: ""
      checkout_ref:
        description: "Git ref to build (e.g. v0.4.1). Leave empty to build the workflow ref."
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  release:
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Validate release inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version == '' && !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          echo "Error: 'version' input is required when running this workflow from a branch (workflow_dispatch), because the workflow can't infer it from a tag."
          exit 1
      - name: Verify Azure OIDC subject
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $expectedSubject = 'repo:joelst/flint:environment:release'
          $requestUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange"
          $tokenResponse = Invoke-RestMethod -Headers @{
            Authorization = ('Bearer ' + $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)
          } -Uri $requestUrl

          $payload = $tokenResponse.value.Split('.')[1].Replace('-', '+').Replace('_', '/')
          switch ($payload.Length % 4) {
            0 { break }
            2 { $payload += '==' }
            3 { $payload += '=' }
            default { throw 'OIDC token payload has invalid base64url padding.' }
          }

          $claimsJson = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload))
          $claims = $claimsJson | ConvertFrom-Json
          Write-Host "OIDC subject claim: $($claims.sub)"

          if ($claims.sub -ne $expectedSubject) {
            throw "Expected Azure OIDC subject '$expectedSubject' but got '$($claims.sub)'. Run workflow_dispatch from the fixed default branch when rebuilding an existing tag; put the tag in checkout_ref instead of selecting the tag as the workflow ref."
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Cache bundled Node binary
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries
            runtime/node-staging
          key: bundled-node-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-v22.18.0-${{ hashFiles('scripts/ensure-bundled-node.cjs') }}

      # Tauri externalBin must exist before build; also stage target triple for cross builds.
      - name: Stage bundled Node (externalBin)
        run: npm run ensure:node -- --target ${{ matrix.target }}

      - name: Set version from tag or dispatch input
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          if [ -z "$VERSION" ]; then
            echo "Error: VERSION is empty."
            exit 1
          fi
          echo "Setting version to $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node scripts/sync-versions.cjs "$VERSION"

          # Determine the pre-release identifier (text after the first hyphen, if any).
          PRERELEASE_ID="${VERSION#*-}"
          if [ "$PRERELEASE_ID" = "$VERSION" ]; then
            PRERELEASE_ID=""
          else
            # Strip SemVer build metadata (e.g. 1.2.3-1+meta -> prerelease id "1").
            PRERELEASE_ID="${PRERELEASE_ID%%+*}"
          fi

          if [ -n "$PRERELEASE_ID" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # The Windows MSI (WiX) bundler only accepts a numeric-only pre-release
          # identifier (e.g. "1.2.3-1"); identifiers like "-mvp" or "-alpha" make
          # WiX bail with "optional pre-release identifier ... must be
          # numeric-only". NSIS has no such restriction, so fall back to NSIS
          # only when the identifier isn't numeric-only, so Windows still
          # produces an installer.
          if [ -n "$PRERELEASE_ID" ] && ! [[ "$PRERELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "win_bundles=nsis" >> "$GITHUB_OUTPUT"
          else
            echo "win_bundles=msi,nsis" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login for Windows signing
        if: ${{ matrix.os == 'windows-latest' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Artifact Signing module
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Scope CurrentUser -Force -Repository PSGallery

      # Tauri swallows signCommand output, so a signing failure during the bundle
      # step only reports `failed to run pwsh`. Sign a throwaway binary first so
      # the real Azure error is visible and the job fails before the Rust build.
      - name: Verify Azure Trusted Signing
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'signing-probe.exe'
          Copy-Item -LiteralPath (Join-Path $PSHOME 'pwsh.exe') -Destination $probe -Force
          # Invoke through a child pwsh exactly like Tauri's signCommand does so
          # the exit code is meaningful.
          & pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./scripts/Invoke-AzureTrustedSigning.ps1 -FilePath $probe
          if ($LASTEXITCODE -ne 0) {
            throw "Azure Trusted Signing preflight failed with exit code $($LASTEXITCODE)."
          }

      # Flint ships unsigned macOS builds (no paid Apple Developer account).
      # A browser-downloaded unsigned app is quarantined and Gatekeeper calls
      # it "damaged"; users install via scripts/install-macos.sh or clear the
      # quarantine attribute (docs/RELEASE.md section 1). If Apple signing
      # secrets are ever added, tauri-action picks them up automatically —
      # but a cert without notarization credentials still produces a blocked
      # app, so fail on that half-configured state.
      # tauri-bundler checks these with Rust's `env::var_os`, which returns
      # Some("") for a step `env:` set from an empty secret — not None. So
      # these must never be forwarded to the build step as empty strings, or
      # tauri tries to import an empty certificate and codesigning fails with
      # "SecKeychainItemImport: ... not valid" even though signing was never
      # requested. Only export them (via GITHUB_ENV) when actually present.
      - name: Check Apple signing secrets
        if: ${{ matrix.os == 'macos-latest' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No APPLE_CERTIFICATE secret; building an UNSIGNED macOS app. Browser downloads will show 'damaged' — point users at scripts/install-macos.sh or 'xattr -cr /Applications/Flint.app' (docs/RELEASE.md section 1)."
            exit 0
          fi
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::APPLE_CERTIFICATE is set but notarization secrets are incomplete. A signed-but-unnotarized app is still blocked by Gatekeeper; add APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID (and APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY as needed), or remove APPLE_CERTIFICATE to release unsigned."
            exit 1
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing/notarization vars (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID) are intentionally NOT
          # set here. The "Check Apple signing secrets" step forwards them via GITHUB_ENV only
          # when APPLE_CERTIFICATE is actually configured; setting them here unconditionally would
          # give tauri-bundler an empty (but "present") APPLE_CERTIFICATE env var and it would try
          # to import an empty certificate, failing codesigning even for unsigned builds.
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "Flint v${{ steps.version.outputs.version }}"
          releaseBody: "See CHANGELOG for details."
          releaseDraft: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.os == 'windows-latest' && steps.version.outputs.win_bundles || matrix.bundles }}

      - name: Show Windows signing log
        if: ${{ always() && matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $log = 'src-tauri/target/flint-signing.log'
          if (Test-Path -LiteralPath $log) {
            Get-Content -LiteralPath $log
          } else {
            Write-Host "No signing log found at $($log)."
          }

      # Guards the failure mode where the native Foundry core is not staged into
      # the bundle: the installer still builds, but every install is broken.
      # --require-build makes a missing/renamed output tree a hard failure rather
      # than a silent skip.
      - name: Verify packaged bundle
        run: npm run verify:bundle -- --target ${{ matrix.target }} --require-build

      - name: Smoke test bundled Node + Foundry SDK
        run: npm run smoke:node -- --target ${{ matrix.target }}

      - name: Upload updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: updater-metadata-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/latest.json
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          retention-days: 7
          if-no-files-found: warn

      - name: Upload debug symbols
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-symbols
          path: src-tauri/target/${{ matrix.target }}/release/*.pdb
          retention-days: 30
