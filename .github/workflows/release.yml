name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.3.0) - for testing without a tag"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag or dispatch input
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          if [ -z "$VERSION" ]; then
            echo "Error: VERSION is empty."
            exit 1
          fi
          echo "Setting version to $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node scripts/sync-versions.cjs "$VERSION"

      - name: Install Windows signing certificate
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
          [System.IO.File]::WriteAllBytes("cert.pfx", $certBytes)
          $password = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -Force -AsPlainText
          Import-PfxCertificate `
            -FilePath "cert.pfx" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Password $password | Out-Null
          $certificate = Get-ChildItem "Cert:\CurrentUser\My\ECFFBBEB8B66B79D4B380AF690EF686D24FA4651"
          if (-not $certificate) {
            throw "Expected Flint signing certificate was not imported"
          }
          Remove-Item "cert.pfx" -Force

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "Flint v${{ steps.version.outputs.version }}"
          releaseBody: "See CHANGELOG for details."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles msi,nsis,dmg,app,updater

      - name: Upload updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: updater-metadata-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/latest.json
            src-tauri/target/release/bundle/**/*.sig
          retention-days: 7
          if-no-files-found: warn

      - name: Upload debug symbols
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-symbols
          path: src-tauri/target/release/*.pdb
          retention-days: 30
